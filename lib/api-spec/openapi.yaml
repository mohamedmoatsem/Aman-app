openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Amān App API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: resources
    description: Resources and tips
  - name: workshops
    description: Workshops
  - name: community
    description: Community posts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /resources:
    get:
      operationId: getResources
      tags: [resources]
      summary: Get all resources and tips
      responses:
        "200":
          description: List of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
    post:
      operationId: createResource
      tags: [resources]
      summary: Create a resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResource"
      responses:
        "201":
          description: Created resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
  /resources/{id}:
    get:
      operationId: getResource
      tags: [resources]
      summary: Get a resource by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workshops:
    get:
      operationId: getWorkshops
      tags: [workshops]
      summary: Get all workshops
      responses:
        "200":
          description: List of workshops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workshop"
    post:
      operationId: createWorkshop
      tags: [workshops]
      summary: Create a workshop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkshop"
      responses:
        "201":
          description: Created workshop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workshop"
  /subscribe:
    post:
      operationId: subscribe
      tags: [community]
      summary: Subscribe with email for daily support messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeBody"
      responses:
        "201":
          description: Subscribed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResponse"
        "409":
          description: Email already subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /community:
    get:
      operationId: getCommunityPosts
      tags: [community]
      summary: Get all community posts
      responses:
        "200":
          description: List of community posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityPost"
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: Create a community post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommunityPost"
      responses:
        "201":
          description: Created community post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPost"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SubscribeBody:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    SubscribeResponse:
      type: object
      properties:
        message:
          type: string
        email:
          type: string
      required:
        - message
        - email
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Resource:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          nullable: true
        category:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - category
        - createdAt
    CreateResource:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          nullable: true
        category:
          type: string
      required:
        - title
        - description
        - category
    Workshop:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
        location:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - date
        - location
        - createdAt
    CreateWorkshop:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
        location:
          type: string
      required:
        - title
        - description
        - date
        - location
    CommunityPost:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        authorName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - content
        - authorName
        - createdAt
    CreateCommunityPost:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        authorName:
          type: string
      required:
        - title
        - content
        - authorName
