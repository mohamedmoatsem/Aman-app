kind = "web"
previewPath = "/"
title = "تطبيق أمان"
version = "1.0.0"
id = "artifacts/aman-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 25816
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/aman-app run dev"

[services.env]
PORT = "25816"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/aman-app", "run", "build"]
publicDir = "artifacts/aman-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
